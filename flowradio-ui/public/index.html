<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src http://localhost:5173 http://localhost:5174; connect-src http://localhost:* ws://localhost:*;">
  <title>FlowRadio - AI DJ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
      background: #000000;
      color: #ffffff;
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* 加载动画 */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s, visibility 0.5s;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 20px;
      font-size: 18px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    /* Canvas 层级控制 */
    canvas {
      display: block;
    }

    /* Live2D Canvas */
    #live2d-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* 设置按钮 */
    #settings-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    #settings-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(90deg);
    }

    #settings-btn svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    /* 设置面板 */
    #settings-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 400px;
      height: 100%;
      background: rgba(20, 20, 30, 0.95);
      backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 999;
      transition: right 0.3s;
      display: flex;
      flex-direction: column;
    }

    #settings-panel.open {
      right: 0;
    }

    .settings-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-header h2 {
      font-size: 20px;
      margin: 0;
    }

    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
    }

    .settings-tabs {
      display: flex;
      padding: 10px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      gap: 10px;
    }

    .tab-btn {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .tab-btn.active {
      background: rgba(102, 126, 234, 0.5);
      border-color: rgba(102, 126, 234, 0.8);
    }

    .settings-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    /* Super Chat 容器 */
    #superChatContainer {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 600px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .sc-card {
      background: linear-gradient(90deg, #d93025, #ea4335);
      color: white;
      padding: 0;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      overflow: hidden;
      animation: slideDown 0.3s ease-out;
      pointer-events: auto;
      position: relative; /* For progress bar positioning */
    }

    .sc-progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.8);
      width: 100%;
      transform-origin: left;
    }

    .sc-header {
      padding: 8px 12px;
      background: rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
    }

    .sc-content {
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.4;
    }

    .sc-price {
      font-family: 'Consolas', monospace;
      background: rgba(255,255,255,0.2);
      padding: 2px 6px;
      border-radius: 4px;
    }

    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* 弹幕容器 */
    #danmakuContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 80;
      overflow: hidden;
    }

    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      font-family: "Microsoft YaHei", sans-serif;
      will-change: transform;
    }

    /* 聊天历史样式 */
    .chat-item {
      padding: 12px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border-left: 3px solid #667eea; /* 默认 AI (Hiyori) 蓝色 */
    }

    .chat-item.user {
      border-left-color: #48bb78; /* 用户 绿色 */
      background: rgba(72, 187, 120, 0.1);
    }

    .chat-item.mao {
      border-left-color: #ed64a6; /* Mao 粉色 */
      background: rgba(237, 100, 166, 0.1);
    }

    .chat-item.ai {
      border-left-color: #667eea; /* Hiyori 蓝色 */
    }
    }

    .chat-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      opacity: 0.7;
    }

    .chat-item-message {
      font-size: 14px;
      line-height: 1.5;
    }

    .chat-item-audio {
      margin-top: 8px;
    }

    .chat-item-audio button {
      padding: 4px 12px;
      background: rgba(102, 126, 234, 0.3);
      border: 1px solid rgba(102, 126, 234, 0.5);
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 12px;
    }

    /* Magenta表单样式 */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      opacity: 0.9;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: white;
      font-size: 14px;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <!-- 加载屏幕 -->
  <div id="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">FlowRadio 正在启动...</div>
  </div>

  <!-- 主应用容器 -->
  <div id="app-container">
    <!-- 背景层由 PixiJS 动态插入 -->
    
    <!-- 弹幕容器 -->
    <div id="danmakuContainer"></div>

    <!-- Super Chat 容器 -->
    <div id="superChatContainer"></div>

    <!-- Live2D 容器 -->
    <div id="live2d-container" style="
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
    ">
      <!-- Live2D iframe（使用独立仓库）-->
      <iframe 
        id="live2d-frame" 
        src="http://localhost:5173/flowradio.html"
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          border: none;
          pointer-events: none;
        "
      ></iframe>
    </div>
    
    <!-- 设置按钮 -->
    <div id="settings-btn">
      <svg viewBox="0 0 24 24">
        <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/>
      </svg>
    </div>

    <!-- 设置面板 -->
    <div id="settings-panel">
      <div class="settings-header">
        <h2>⚙️ 设置</h2>
        <button class="close-btn">✕</button>
      </div>

      <div class="settings-tabs">
        <button class="tab-btn active" data-tab="history">聊天历史</button>
        <button class="tab-btn" data-tab="magenta">Magenta</button>
      </div>

      <div class="settings-content">
        <!-- 聊天历史 -->
        <div class="tab-pane active" id="tab-history">
          <div class="history-controls" style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
            <select id="history-filter" style="flex: 1; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 4px;">
              <option value="all">全部显示</option>
              <option value="User">👤 本地用户</option>
              <option value="AI">🤖 Hiyori (Host 1)</option>
              <option value="Mao">🐱 Mao (Host 2)</option>
              <option value="SuperChat">💰 所有 Super Chat</option>
            </select>
            <button id="clear-history-btn" style="padding: 8px 12px; background: #e53e3e; border: none; border-radius: 4px; color: white; cursor: pointer;">清空</button>
          </div>
          <div id="chat-history-list"></div>
        </div>

        <!-- Magenta表单 -->
        <div class="tab-pane" id="tab-magenta">
          <form id="magenta-form">
            <h3 style="margin-bottom: 20px;">🎵 音乐生成参数</h3>
            
            <div class="form-group">
              <label>BPM (节奏速度)</label>
              <input type="number" name="bpm" value="120" min="60" max="180" step="5">
            </div>

            <div class="form-group">
              <label>Temperature (创造性): <span id="temp-value">1.0</span></label>
              <input type="range" name="temperature" min="0" max="2" step="0.1" value="1.0">
            </div>

            <div class="form-group">
              <label>Brightness (明亮度): <span id="brightness-value">0.5</span></label>
              <input type="range" name="brightness" min="0" max="1" step="0.1" value="0.5">
            </div>

            <div class="form-group">
              <label>Density (密集度): <span id="density-value">0.5</span></label>
              <input type="range" name="density" min="0" max="1" step="0.1" value="0.5">
            </div>

            <div class="form-group">
              <label>Guidance (引导强度)</label>
              <input type="number" name="guidance" value="7" min="1" max="15">
            </div>

            <div class="form-group">
              <label>Scale (音阶)</label>
              <select name="scale">
                <option value="major">大调 (Major)</option>
                <option value="minor">小调 (Minor)</option>
                <option value="dorian">多利亚 (Dorian)</option>
                <option value="phrygian">弗里吉亚 (Phrygian)</option>
                <option value="lydian">利底亚 (Lydian)</option>
                <option value="mixolydian">混合利底亚 (Mixolydian)</option>
                <option value="pentatonic">五声音阶 (Pentatonic)</option>
              </select>
            </div>

            <div class="form-group">
              <label>提示词 (Weighted Prompts)</label>
              <textarea name="prompts" rows="4" placeholder="每行一个提示词，格式: 提示词|权重
例如:
happy upbeat|0.8
electronic dance|0.6"></textarea>
            </div>

            <div class="form-group">
              <label>推理说明 (可选)</label>
              <textarea name="reasoning" rows="2" placeholder="音乐生成的理由或说明..."></textarea>
            </div>

            <button type="submit" class="submit-btn">🎵 生成音乐</button>
          </form>
        </div>
      </div>
    </div>
    
    <!-- 其他 UI 元素由 JavaScript 动态创建 -->
  </div>

  <!-- 主渲染脚本 -->
  <script>
    console.log('[HTML] Script block started');
    
    // 全局错误捕获
    window.addEventListener('error', (event) => {
      console.error('❌ [Global Error]', event.error);
      console.error('  Message:', event.message);
      console.error('  Filename:', event.filename);
      console.error('  Line:', event.lineno, 'Col:', event.colno);
      
      // 显示错误到页面
      const errorDiv = document.createElement('div');
      errorDiv.style.cssText = `
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(255,0,0,0.8);
        color: white;
        padding: 20px;
        border-radius: 10px;
        z-index: 10000;
        max-width: 600px;
        font-family: monospace;
        font-size: 12px;
      `;
      errorDiv.innerHTML = `
        <strong>❌ Error:</strong><br>
        ${event.message}<br>
        <small>${event.filename}:${event.lineno}</small>
      `;
      document.body.appendChild(errorDiv);
    });

    window.addEventListener('unhandledrejection', (event) => {
      console.error('❌ [Unhandled Promise Rejection]', event.reason);
    });

    // 早期初始化设置面板交互(在renderer加载前)
    window.toggleSettings = function() {
      const panel = document.getElementById('settings-panel');
      if (panel) {
        panel.classList.toggle('open');
      }
    };

    // 设置按钮点击事件
    document.addEventListener('DOMContentLoaded', () => {
      const settingsBtn = document.getElementById('settings-btn');
      const closeBtn = document.querySelector('.close-btn');
      
      if (settingsBtn) {
        settingsBtn.addEventListener('click', window.toggleSettings);
      }
      if (closeBtn) {
        closeBtn.addEventListener('click', window.toggleSettings);
      }
      
      console.log('[HTML] ✓ Settings panel event listeners attached');
    });

    try {
      console.log('[HTML] Requiring renderer.js...');
      // 使用 CommonJS require
      const renderer = require('../src/renderer.js');
      console.log('[HTML] ✓ Renderer required successfully');
    } catch (error) {
      console.error('[HTML] ❌ Failed to require renderer:', error);
      console.error('[HTML] Stack:', error.stack);
    }

    // 隐藏加载屏幕
    window.addEventListener('load', () => {
      console.log('[HTML] Window loaded event fired');
      setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.classList.add('hidden');
          console.log('[HTML] Loading screen hidden');
        }
      }, 1000);
    });
  </script>
</body>
</html>
